<svg
  width="900"
  height="160"
  viewBox="0 0 900 160"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient
      id="background"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%">

      <stop
        offset="0%"
        stop-color="#0d1117"/>

      <stop
        offset="100%"
        stop-color="#161b22"/>

    </linearGradient>
  </defs>

  <rect
    x="1"
    y="1"
    width="898"
    height="158"
    rx="16"
    fill="url(#background)"
    stroke="#30363d"/>

  <text
    x="450"
    y="35"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="18"
    font-weight="bold"
    fill="#58a6ff">
    GitHub Activity
  </text>

  <!-- PRs Opened -->

  <text
    x="100"
    y="75"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="28">
    🔀
  </text>

  <text
    x="100"
    y="110"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="#f0f6fc">
    3
  </text>

  <text
    x="100"
    y="135"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="12"
    fill="#8b949e">
    PRs Opened
  </text>

  <!-- PRs Merged -->

  <text
    x="325"
    y="75"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="28">
    ✓
  </text>

  <text
    x="325"
    y="110"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="#f0f6fc">
    2
  </text>

  <text
    x="325"
    y="135"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="12"
    fill="#8b949e">
    PRs Merged
  </text>

  <!-- Issues -->

  <text
    x="550"
    y="75"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="28">

  </text>

  <text
    x="775"
    y="110"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="#f0f6fc">
    0
  </text>

  <text
    x="775"
    y="135"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="12"
    fill="#8b949e">
    Repository Stars
  </text>


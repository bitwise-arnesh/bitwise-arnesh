  </text>

  <text
    x="550"
    y="110"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold"
    fill="#f0f6fc">
    5
  </text>

  <text
    x="550"
    y="135"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="12"
    fill="#8b949e">
    Issues Opened
  </text>

  <!-- Stars -->

  <text
    x="775"
    y="75"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="28">

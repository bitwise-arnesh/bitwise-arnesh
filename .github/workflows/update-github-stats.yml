name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: bitwise-arnesh
        run: |
          python <<'PY'
          import os
          import urllib.request
          import urllib.parse

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-stats"
          }

          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return response.read().decode("utf-8")

          def search_count(query):
              encoded_query = urllib.parse.quote(query)

              data = github_api(
                  f"https://api.github.com/search/issues?q={encoded_query}"
              )

              import json
              return json.loads(data)["total_count"]

          # -------------------------------
          # Pull Requests
          # -------------------------------

          prs_opened = search_count(
              f"author:{username} is:pr"
          )

          prs_merged = search_count(
              f"author:{username} is:pr is:merged"
          )

          # -------------------------------
          # Issues
          # -------------------------------

          issues_opened = search_count(
              f"author:{username} is:issue"
          )

          # -------------------------------
          # Repository Stars
          # -------------------------------

          repositories = []

          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/"
                  f"{username}/repos"
                  f"?per_page=100&page={page}"
              )

              data = github_api(url)

              import json
              repos = json.loads(data)

              if not repos:
                  break

              repositories.extend(repos)

              if len(repos) < 100:
                  break

              page += 1

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          # -------------------------------
          # Generate SVG
          # -------------------------------

          svg = f"""<svg
            width="900"
            height="160"
            viewBox="0 0 900 160"
            xmlns="http://www.w3.org/2000/svg">

            <defs>
              <linearGradient
                id="background"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%">

                <stop
                  offset="0%"
                  stop-color="#0d1117"/>

                <stop
                  offset="100%"
                  stop-color="#161b22"/>

              </linearGradient>
            </defs>

            <rect
              x="1"
              y="1"
              width="898"
              height="158"
              rx="16"
              fill="url(#background)"
              stroke="#30363d"/>

            <text
              x="450"
              y="35"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="18"
              font-weight="bold"
              fill="#58a6ff">
              GitHub Activity
            </text>

            <!-- PRs Opened -->

            <text
              x="100"
              y="75"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="28">
              🔀
            </text>

            <text
              x="100"
              y="110"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              {prs_opened}
            </text>

            <text
              x="100"
              y="135"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="12"
              fill="#8b949e">
              PRs Opened
            </text>

            <!-- PRs Merged -->

            <text
              x="325"
              y="75"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="28">
              ✓
            </text>

            <text
              x="325"
              y="110"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              {prs_merged}
            </text>

            <text
              x="325"
              y="135"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="12"
              fill="#8b949e">
              PRs Merged
            </text>

            <!-- Issues -->

            <text
              x="550"
              y="75"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="28">
              #
            </text>

            <text
              x="550"
              y="110"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              {issues_opened}
            </text>

            <text
              x="550"
              y="135"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="12"
              fill="#8b949e">
              Issues Opened
            </text>

            <!-- Stars -->

            <text
              x="775"
              y="75"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="28">
              ★
            </text>

            <text
              x="775"
              y="110"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="25"
              font-weight="bold"
              fill="#f0f6fc">
              {stars}
            </text>

            <text
              x="775"
              y="135"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="12"
              fill="#8b949e">
              Repository Stars
            </text>

          </svg>"""

          with open(
              "github-stats.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("===================================")
          print("GitHub Profile Statistics")
          print("===================================")
          print(f"PRs Opened     : {prs_opened}")
          print(f"PRs Merged     : {prs_merged}")
          print(f"Issues Opened  : {issues_opened}")
          print(f"Repository Stars: {stars}")
          print("===================================")
          PY

      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi
